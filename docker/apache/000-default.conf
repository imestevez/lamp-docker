ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        # Applications used in the course may define rewrite rules in .htaccess.
        AllowOverride All
        Require all granted
    </Directory>

    # Send Apache output to Docker instead of keeping it only inside the container.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
